  name: Java CI/CD with Gradle
  
  on:
    push:
      branches: ["develop"]
  
  permissions:
    contents: read
  
  jobs:
    build:
      runs-on: ubuntu-latest
      steps:  
        - name: Checkout 
          uses: actions/checkout@v3
  
        - name: Set up JDK 17
          uses: actions/setup-java@v3
          with:
            java-version: '17'
            distribution: 'temurin'
            
        - name: Grant Execute Permission For Gradlew
          run: chmod +x trippy-server/gradlew
          
        - name: Create application.properties
          run: |
            mkdir -p trippy-server/src/main/resources
            printf '%s' "${{ secrets.APPLICATION_PROPERTIES }}" \
            > ./src/main/resources/application.properties
          working-directory: ./trippy-server
  
        - name: Gradle Caching
          uses: actions/cache@v3
          with:
            path: |
              ~/.gradle/caches
              ~/.gradle/wrapper
            key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
            restore-keys: |
              ${{ runner.os }}-gradle-
              
        - name: Build With Gradle
          run: ./gradlew build -x test
          working-directory: ./trippy-server
          
        - name: docker image build
          run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/trippy .
          working-directory: ./trippy-server
  
        - name: docker login
          uses: docker/login-action@v2
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_PASSWORD }}
  
        - name: docker Hub push
          run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/trippy
  
    deploy:
      needs: build
      runs-on: self-hosted
      steps:
        - name: Pull latest Docker image
          run: sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/trippy
    
        - name: Stop and remove existing container (if any)
          run: |
            if sudo docker ps -a --format '{{.Names}}' | grep -q trippy; then
              sudo docker rm -f trippy || true
            fi
    
        - name: Run new container
          run: |
            cd /home/ubuntu/trippy  # docker-compose.yml, .env 위치
            sudo docker compose up -d
    
        - name: Prune unused Docker images
          run: sudo docker system prune -f
